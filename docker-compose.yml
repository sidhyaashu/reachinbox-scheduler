services:
  # ==========================================
  # Infrastructure Services
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: reachinbox_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: reachinbox_user
      POSTGRES_PASSWORD: reachinbox_password
      POSTGRES_DB: reachinbox_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reachinbox_user -d reachinbox_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: reachinbox_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: reachinbox_elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ==========================================
  # Database Migration One-Off Runner
  # ==========================================
  migrator:
    build:
      context: .
      target: migrator
    container_name: reachinbox_migrator
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: reachinbox_user
      PGPASSWORD: reachinbox_password
      PGDATABASE: reachinbox_db

  # ==========================================
  # Microservices
  # ==========================================
  api:
    build:
      context: .
      target: api
    container_name: reachinbox_api
    restart: unless-stopped
    ports:
      - "4001:4001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      EMAIL_API_PORT: 4001
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: reachinbox_user
      PGPASSWORD: reachinbox_password
      PGDATABASE: reachinbox_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SEARCH_SERVICE_URL: http://search:4004
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
      SLACK_CLIENT_ID: ${SLACK_CLIENT_ID}
      SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET}
      SLACK_REDIRECT_URI: ${SLACK_REDIRECT_URI}
      SESSION_SECRET: ${SESSION_SECRET}
      WEB_URL: ${WEB_URL:-https://reachinbox.ovanthra.com}
      APPLICATIONINSIGHTS_CONNECTION_STRING: ${APPLICATIONINSIGHTS_CONNECTION_STRING:-}
      APPLICATIONINSIGHTS_ROLE_NAME: reachinbox-api
      OTEL_SERVICE_NAME: reachinbox-api

  scheduler:
    build:
      context: .
      target: scheduler
    container_name: reachinbox_scheduler
    restart: unless-stopped
    ports:
      - "4002:4002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      SCHEDULER_PORT: 4002
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: reachinbox_user
      PGPASSWORD: reachinbox_password
      PGDATABASE: reachinbox_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OUTBOX_POLL_INTERVAL_MS: 1000
      OUTBOX_BATCH_SIZE: 100
      SCHEDULER_CONCURRENCY: 10
      APPLICATIONINSIGHTS_CONNECTION_STRING: ${APPLICATIONINSIGHTS_CONNECTION_STRING:-}
      APPLICATIONINSIGHTS_ROLE_NAME: reachinbox-scheduler
      OTEL_SERVICE_NAME: reachinbox-scheduler

  worker:
    build:
      context: .
      target: worker
    container_name: reachinbox_worker
    restart: unless-stopped
    ports:
      - "4003:4003"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      WORKER_PORT: 4003
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: reachinbox_user
      PGPASSWORD: reachinbox_password
      PGDATABASE: reachinbox_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      WORKER_CONCURRENCY: 5
      MIN_INTER_SEND_DELAY_SECONDS: 2
      DEFAULT_HOURLY_LIMIT: 200
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      SEARCH_SERVICE_URL: http://search:4004
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      ETHEREAL_USER: ${ETHEREAL_USER:-}
      ETHEREAL_PASS: ${ETHEREAL_PASS:-}
      ETHEREAL_HOST: ${ETHEREAL_HOST:-smtp.ethereal.email}
      ETHEREAL_PORT: ${ETHEREAL_PORT:-587}
      ETHEREAL_SECURE: ${ETHEREAL_SECURE:-false}
      ALLOW_SANDBOX_FALLBACK: ${ALLOW_SANDBOX_FALLBACK:-true}
      APPLICATIONINSIGHTS_CONNECTION_STRING: ${APPLICATIONINSIGHTS_CONNECTION_STRING:-}
      APPLICATIONINSIGHTS_ROLE_NAME: reachinbox-worker
      OTEL_SERVICE_NAME: reachinbox-worker

  search:
    build:
      context: .
      target: search
    container_name: reachinbox_search
    restart: unless-stopped
    ports:
      - "4004:4004"
    depends_on:
      elasticsearch:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      SEARCH_PORT: 4004
      ELASTICSEARCH_NODE: http://elasticsearch:9200
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: reachinbox_user
      PGPASSWORD: reachinbox_password
      PGDATABASE: reachinbox_db
      APPLICATIONINSIGHTS_CONNECTION_STRING: ${APPLICATIONINSIGHTS_CONNECTION_STRING:-}
      APPLICATIONINSIGHTS_ROLE_NAME: reachinbox-search
      OTEL_SERVICE_NAME: reachinbox-search

  gateway:
    build:
      context: .
      target: gateway
    container_name: reachinbox_gateway
    restart: unless-stopped
    ports:
      - "4000:4000"
    depends_on:
      - api
      - search
      - redis
    environment:
      NODE_ENV: production
      GATEWAY_PORT: 4000
      EMAIL_API_URL: http://api:4001
      SEARCH_SERVICE_URL: http://search:4004
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: reachinbox_user
      PGPASSWORD: reachinbox_password
      PGDATABASE: reachinbox_db
      SESSION_SECRET: ${SESSION_SECRET}
      WEB_URL: ${WEB_URL:-https://reachinbox.ovanthra.com}
      APPLICATIONINSIGHTS_CONNECTION_STRING: ${APPLICATIONINSIGHTS_CONNECTION_STRING:-}
      APPLICATIONINSIGHTS_ROLE_NAME: reachinbox-gateway
      OTEL_SERVICE_NAME: reachinbox-gateway

  web:
    build:
      context: .
      target: web
    container_name: reachinbox_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - gateway
    environment:
      NODE_ENV: production
      PORT: 3000
      API_GATEWAY_URL: http://gateway:4000

  # ==========================================
  # Edge Reverse Proxy (Caddy - Automatic HTTPS & Let's Encrypt for Custom Domain)
  # ==========================================
  caddy:
    image: caddy:2-alpine
    container_name: reachinbox_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - gateway
      - web

  # Optional Nginx profile for local non-SSL development
  nginx:
    image: nginx:alpine
    container_name: reachinbox_nginx
    restart: unless-stopped
    profiles: ["nginx"]
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gateway
      - web

volumes:
  pgdata:
  redisdata:
  esdata:
  caddy_data:
  caddy_config:
