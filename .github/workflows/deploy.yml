name: CI/CD Pipeline - Test & Deploy to Azure VM

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # ==========================================
  # Stage 1: Quality Gate (Lint, Build, Test)
  # ==========================================
  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Build Monorepo (Ordered Packages & Apps)
        run: npm run build

      - name: Run Vitest Test Suite (38 Tests)
        run: npm test

  # ==========================================
  # Stage 2: Continuous Deployment to Azure VM
  # ==========================================
  deploy:
    name: Deploy to Azure VM (outboxvm)
    needs: test
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Azure VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST || '104.43.57.147' }}
          username: ${{ secrets.VM_USERNAME || 'azureuser' }}
          key: ${{ secrets.VM_SSH_KEY }}
          passphrase: ${{ secrets.VM_SSH_PASSPHRASE }}
          password: ${{ secrets.VM_PASSWORD }}
          port: 22
          script_stop: true
          script: |
            echo "🚀 Starting ReachInbox deployment on Azure VM..."

            # Ensure Docker and Docker Compose plugin are available
            if ! command -v docker &> /dev/null; then
              echo "Installing Docker..."
              curl -fsSL https://get.docker.com | sh
              sudo usermod -aG docker $USER
            fi

            # Create destination directory
            APP_DIR="/opt/reachinbox"
            sudo mkdir -p $APP_DIR
            sudo chown -R $USER:$USER $APP_DIR

            # Initialize or update git repository safely
            if [ ! -d "$APP_DIR/.git" ]; then
              echo "Initializing git repository in $APP_DIR..."
              git -C $APP_DIR init -b main
              git -C $APP_DIR remote add origin https://github.com/${{ github.repository }}.git 2>/dev/null || git -C $APP_DIR remote set-url origin https://github.com/${{ github.repository }}.git
            fi
            echo "Fetching latest changes from origin main..."
            git -C $APP_DIR fetch origin main
            git -C $APP_DIR reset --hard origin/main
            cd $APP_DIR

            # Inject production environment variables from GitHub Secret if provided
            if [ -n "${{ secrets.ENV_FILE }}" ]; then
              echo "Injecting production .env configuration from GitHub Secret..."
              cat << 'EOF' > .env
${{ secrets.ENV_FILE }}
EOF
            elif [ -f .env ]; then
              echo "Preserving existing .env configuration on VM."
            else
              echo "⚠️ Error: No .env found on VM and secrets.ENV_FILE is not set in GitHub repository secrets!"
              echo "Please configure ENV_FILE in repository secrets or create /opt/reachinbox/.env"
              exit 1
            fi

            # Deploy containers with Docker Compose & Caddy
            echo "Building and starting Docker Compose services..."
            docker compose pull postgres redis elasticsearch caddy || true
            docker compose up -d --build --remove-orphans

            # Wait for Gateway & Caddy health check
            echo "Waiting for services to become healthy..."
            sleep 15
            docker compose ps

            # Health verification
            if curl -s -f http://localhost:4000/health/live > /dev/null; then
              echo "✅ API Gateway Health Check: PASSED"
            else
              echo "⚠️ Warning: Gateway health check did not respond immediately, check docker logs."
            fi

            echo "🎉 Deployment successfully finished! Accessible at https://reachinbox.ovanthra.com"
