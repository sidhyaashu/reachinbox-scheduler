name: CI/CD Pipeline - Test & Deploy to Azure VM

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ==========================================
  # Stage 1: Quality Gate (Lint, Build, Test)
  # ==========================================
  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Build Monorepo (Ordered Packages & Apps)
        run: npm run build

      - name: Run Vitest Test Suite (38 Tests)
        run: npm test

  # ==========================================
  # Stage 2: Continuous Deployment to Azure VM
  # ==========================================
  deploy:
    name: Deploy to Azure VM (outboxvm)
    needs: test
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Azure VM
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_HOST: ${{ secrets.VM_HOST || '104.43.57.147' }}
          VM_USER: ${{ secrets.VM_USERNAME || 'azureuser' }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p 22 -H "$VM_HOST" >> ~/.ssh/known_hosts

          echo "🚀 Ensuring destination directory exists on Azure VM..."
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "$VM_USER@$VM_HOST" "sudo mkdir -p /opt/reachinbox && sudo chown -R $VM_USER:$VM_USER /opt/reachinbox"

          echo "📦 Syncing repository files and git metadata to Azure VM via rsync..."
          rsync -avz --delete \
            --exclude 'node_modules' \
            --exclude '.next' \
            --exclude '.env' \
            -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no" \
            ./ "$VM_USER@$VM_HOST:/opt/reachinbox/"

          echo "🚀 Executing Docker Compose deployment on Azure VM..."
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "$VM_USER@$VM_HOST" 'bash -s' << 'EOF'
            set -e
            cd /opt/reachinbox

            echo "Current deployed commit: $(git log -n 1 --oneline 2>/dev/null || echo 'No git history')"

            # Ensure production .env exists
            if [ ! -f .env ]; then
              echo "Creating initial .env from .env.example..."
              cp .env.example .env
            else
              echo "Preserving existing production .env."
            fi

            # Deploy containers with Docker Compose
            echo "Building and updating Docker Compose services..."
            docker compose pull postgres redis elasticsearch caddy || true
            docker compose up -d --build --remove-orphans

            # Health verification
            echo "Waiting for services to become healthy..."
            sleep 15
            docker compose ps

            if curl -s -f http://localhost:4000/health/live > /dev/null 2>&1; then
              echo "✅ API Gateway Health Check: PASSED"
            else
              echo "⚠️ Warning: Gateway health check did not respond immediately, check docker logs."
            fi

            echo "🎉 Deployment successfully finished! Accessible at https://reachinbox.ovanthra.com"
          EOF
