name: CI/CD Pipeline - Test & Deploy to Azure VM

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ==========================================
  # Stage 1: Quality Gate (Lint, Build, Test)
  # ==========================================
  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Build Monorepo (Ordered Packages & Apps)
        run: npm run build

      - name: Run Vitest Test Suite (38 Tests)
        run: npm test

  # ==========================================
  # Stage 2: Continuous Deployment to Azure VM
  # ==========================================
  deploy:
    name: Deploy to Azure VM (outboxvm)
    needs: test
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Azure VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST || '104.43.57.147' }}
          username: ${{ secrets.VM_USERNAME || 'azureuser' }}
          key: ${{ secrets.VM_SSH_KEY }}
          passphrase: ${{ secrets.VM_SSH_PASSPHRASE }}
          password: ${{ secrets.VM_PASSWORD }}
          port: 22
          timeout: 60s
          command_timeout: 15m
          script_stop: true
          script: |
            echo "🚀 Starting ReachInbox deployment on Azure VM..."

            APP_DIR="/opt/reachinbox"
            sudo mkdir -p "$APP_DIR"
            sudo chown -R azureuser:azureuser "$APP_DIR"
            cd "$APP_DIR"

            # Authenticate git remote with current GitHub Action run token
            if [ ! -d ".git" ]; then
              git init -b main
              git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
            else
              git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
            fi

            echo "Fetching latest changes from origin main..."
            git fetch origin main
            git reset --hard origin/main

            # Ensure production .env exists
            if [ ! -f .env ]; then
              echo "Creating initial .env from .env.example..."
              cp .env.example .env
            else
              echo "Preserving existing production .env."
            fi

            # Deploy containers with Docker Compose
            echo "Building and updating Docker Compose services..."
            docker compose pull postgres redis elasticsearch caddy || true
            docker compose up -d --build --remove-orphans

            # Health verification
            echo "Waiting for services to become healthy..."
            sleep 15
            docker compose ps

            if curl -s -f http://localhost:4000/health/live > /dev/null 2>&1; then
              echo "✅ API Gateway Health Check: PASSED"
            else
              echo "⚠️ Warning: Gateway health check did not respond immediately, check docker logs."
            fi

            echo "🎉 Deployment successfully finished! Accessible at https://reachinbox.ovanthra.com"
